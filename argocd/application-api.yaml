apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-lab-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jhlee95129/gitops-lab.git
    targetRevision: main
    path: deploy/api
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
