name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gitops-lab-${{ matrix.app }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gitops-lab-${{ matrix.app }}:latest
