apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gitops-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: gitops-lab-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: "http://api.gitops-lab.svc.cluster.local:4000"
